name: deploy-server

# Любой пуш в main: собираем Docker-образ сервера, кладём в GHCR
# и говорим VPS его подтянуть. Сборка идёт здесь — VPS только скачивает.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Два деплоя одновременно не нужны; текущий не отменяем, чтобы не оборвать его на середине.
concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Имя образа
        id: name
        # В GHCR допустим только нижний регистр, а owner может быть с заглавными.
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/server" \
            >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH-ключ
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # Без секрета VPS_KNOWN_HOSTS ключ хоста берётся на доверии при каждом запуске.
            ssh-keyscan -p "${PORT:-22}" -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Обновить docker-compose.yml на сервере
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USERNAME: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_PATH: ${{ secrets.VPS_PATH }}
        run: |
          scp -i ~/.ssh/id_deploy -P "${PORT:-22}" -o BatchMode=yes \
            server/docker-compose.yml \
            "$USERNAME@$HOST:${DEPLOY_PATH:-/srv/g-launcher}/docker-compose.yml"

      - name: Забрать образ и перезапустить
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USERNAME: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
          DEPLOY_PATH: ${{ secrets.VPS_PATH }}
          # Разворачиваем ровно тот образ, что собрали шагом выше, а не «что-то с тегом
          # latest»: имя приходит из CI, поэтому в .env на сервере его держать не обязательно.
          SERVER_IMAGE: ${{ needs.build.outputs.image }}:sha-${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" -o BatchMode=yes "$USERNAME@$HOST" \
            "DEPLOY_PATH='${DEPLOY_PATH:-/srv/g-launcher}' SERVER_IMAGE='$SERVER_IMAGE' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"

          # Прописываем образ в .env, чтобы ручной `docker compose up -d` на сервере
          # поднимал ту же версию, что и деплой.
          touch .env
          if grep -q '^SERVER_IMAGE=' .env; then
            sed -i "s|^SERVER_IMAGE=.*|SERVER_IMAGE=$SERVER_IMAGE|" .env
          else
            printf 'SERVER_IMAGE=%s\n' "$SERVER_IMAGE" >> .env
          fi

          docker compose pull
          docker compose up -d --remove-orphans

          # Ждём, пока контейнер сам себя признает здоровым (HEALTHCHECK из Dockerfile).
          for i in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' gandoni-launcher-server 2>/dev/null || echo starting)"
            [ "$status" = "healthy" ] && break
            if [ "$i" = "30" ]; then
              echo "Контейнер не поднялся, последние логи:" >&2
              docker compose logs --tail 50 gandoni >&2
              exit 1
            fi
            sleep 2
          done

          echo "Сервер здоров: $(docker inspect --format '{{.Config.Image}}' gandoni-launcher-server)"
          docker image prune -f >/dev/null
          REMOTE
