# Пока сертификата нет: отдаём сайт по http и держим открытой проверку
# Let's Encrypt. Без этого шага сертификат не выпустить — certbot подтверждает
# владение доменом как раз через 80-й порт.
#
# {{DOMAIN}} подставляет nginx.sh при запуске контейнера.

server {
    listen 80;
    listen [::]:80;
    server_name {{DOMAIN}};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Адрес сервера разбираем на каждом запросе через встроенный DNS docker.
    # Без этого nginx резолвит имя один раз при старте и падает, если контейнер
    # сервера в тот момент ещё не поднялся, — а деплой пересоздаёт его каждый раз.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream http://gandoni:8080;

    # Размер мода не ограничиваем: сам сервер тоже не ограничивает.
    client_max_body_size 0;

    # Загрузка мода уходит на бэкенд потоком, а не копится сначала на диске,
    # а раздача jar-ов и установщиков — потоком в обратную сторону.
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass $upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # Файлы адресуются по хэшу, поэтому их можно кэшировать вечно.
    location /files/ {
        proxy_pass $upstream;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
