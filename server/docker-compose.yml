services:
  gandoni:
    # Образ собирается в GitHub Actions и приезжает сюда готовым — на VPS
    # ничего не компилируется. Откат: SERVER_IMAGE=...:sha-<коммит> в .env.
    image: ${SERVER_IMAGE:?SERVER_IMAGE не задан в .env}
    container_name: gandoni-launcher-server
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      PORT: 8080
    volumes:
      # База и загруженные моды переживают пересборку контейнера.
      - ./data:/data
    # Портов наружу не публикуем. 80 и 443 на этой машине держит общий
    # reverse-proxy — он же и раздаёт сертификаты остальным проектам. Мы просто
    # стоим с ним в одной сети, и он ходит к нам по имени контейнера.
    expose:
      - "8080"
    networks:
      - proxy

networks:
  proxy:
    # Сеть заводит проект reverse-proxy (`docker network create web`), мы к ней
    # только подключаемся. Имя можно перебить через PROXY_NETWORK в .env, если
    # сервер устроен иначе.
    external: true
    name: ${PROXY_NETWORK:-web}
